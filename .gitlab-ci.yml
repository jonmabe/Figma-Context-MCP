image: node:18

stages:
  - build
  - release

# Cache node_modules for faster builds
cache:
  paths:
    - node_modules/

# Regular build job for non-tagged commits
build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - npm ci
    - npm run build
    - npm pack
  artifacts:
    paths:
      - figma-developer-mcp-*.tgz
    expire_in: 1 week

# Build job specifically for releases
build-release:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci
    - npm run build
    - npm pack
  artifacts:
    paths:
      - figma-developer-mcp-*.tgz
    expire_in: never

release:
  stage: release
  needs: ["build-release"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for version ${CI_COMMIT_TAG}"
    - PKG_FILE=$(ls figma-developer-mcp-*.tgz)
    - echo "Package file: $PKG_FILE"
  release:
    name: 'Figma MCP with OAuth Support ${CI_COMMIT_TAG}'
    description: 'This release adds OAuth token support using the Authorization Bearer method, while maintaining compatibility with Personal Access Tokens.'
    tag_name: $CI_COMMIT_TAG
    assets:
      links:
        - name: 'Pre-built package'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PKG_FILE}?job=build-release'
          link_type: 'package' 