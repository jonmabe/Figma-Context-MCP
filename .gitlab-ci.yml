image: node:18

stages:
  - build
  - release

# Cache node_modules for faster builds
cache:
  paths:
    - node_modules/

# Regular build job for non-tagged commits
build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - npm install -g pnpm
    - pnpm install
    - pnpm build
    - pnpm pack
  artifacts:
    paths:
      - figma-developer-mcp-*.tgz
    expire_in: 1 week

# Build job specifically for releases
build-release:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm install -g pnpm
    - pnpm install
    - pnpm build
    - pnpm pack
    - mkdir -p release
    - cp figma-developer-mcp-*.tgz release/figma-mcp.tgz
  artifacts:
    paths:
      - release/figma-mcp.tgz
    expire_in: never

release:
  stage: release
  needs: ["build-release"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for version ${CI_COMMIT_TAG}"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG of the Figma MCP Server'
    tag_name: $CI_COMMIT_TAG
    assets:
      links:
        - name: 'figma-mcp.tgz'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/figma-mcp.tgz?job=build-release'
          link_type: 'package' 